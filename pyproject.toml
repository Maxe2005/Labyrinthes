[project]
name = "labyrinthes"
version = "0.1.0"
description = "Maze editor and game"
requires-python = ">=3.12"
dependencies = [
    "pillow",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labyrinthes"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy monoliths kept as reference during the progressive rewrite; not linted/formatted.
extend-exclude = ["Creer_labyrinthes.py", "Labyrinthes_copy.py", "Autres/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `tests/test_architecture_boundaries_scanner.py` import
# `tests.test_architecture_boundaries` under plain `pytest`, not only `python -m pytest`
# (which prepends cwd to sys.path on its own).
pythonpath = ["."]
